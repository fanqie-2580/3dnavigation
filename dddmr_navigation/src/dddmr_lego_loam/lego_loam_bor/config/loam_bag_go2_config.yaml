bag_reader:
  ros__parameters:
    use_sim_time: true
    bag_file_dir: "/root/dddmr_bags/issue47"
    point_cloud_topic: "/livox/lidar"
    odometry_topic: "/utlidar/robot_odomf"
    skip_frame: 1

lego_loam_ip:
  ros__parameters:
    use_sim_time: true
    # leishen16
    laser:
        odom_type: "wheel_odometry"         #wheel_odometry/laser_odometry 
        baselink_frame: "base_link"
        num_vertical_scans: 32
        num_horizontal_scans: 1000
        vertical_angle_bottom: -7.0          # degrees
        vertical_angle_top: 52.0            # degrees
        scan_period: 0.1                   # seconds
        
    imageProjection:
        segment_valid_point_num: 5
        segment_valid_line_num: 2
        segment_theta: 60.0                      # decrese this value may impro>
        minimum_detection_range: 0.5
        maximum_detection_range: 100.0            # point cloud within this ran>
        distance_for_patch_between_rings: 1.0    # patch ground between rings w>
        stitcher_num: 2                          # for non-repetitive scan lida>
        trt_model_path: ""                       # provide trt engine for yolo
        projected_image_stack_size: 1            # Stack this number of image f>

        ground_fov_bottom: -0.12217 # -15deg
        ground_fov_top: 0.14 # -5deg
        ground_positive_start: 0.0
        ground_positive_stop: 1.57
        ground_negative_start: 0.0
        ground_negative_stop: -1.57
lego_loam_fa:
  ros__parameters:
    use_sim_time: true
    featureAssociation:
        edge_threshold: 0.1
        surf_threshold: 0.1
        nearest_feature_search_distance: 3.0

    mapping:
        to_map_optimization: true

lego_loam_mo:
  ros__parameters:
    use_sim_time: true
    mapping:

        distance_between_key_frame: 1.0
        angle_between_key_frame: 1.0

        enable_loop_closure: true

        surrounding_keyframe_search_num: 20
        history_keyframe_search_radius: 12.0
        history_keyframe_search_num: 5
        history_keyframe_fitness_score: 0.5

        ground_voxel_size: 0.3
        ground_edge_threshold_num: 50


