/**:
  ros__parameters:
    # FAST-LIO-MULTI Bundle on PV-LIO voxels (Mid360 + Odin1).
    common:
      lid_topic: "/livox/lidar"
      lid_topic2: "/odin1/cloud_raw"
      imu_topic: "/livox/imu"
      time_sync_en: false
      multi_lidar: true
      lidar2_soft_wait_sec: 0.08

    preprocess:
      lidar_type: 1
      scan_line: 4
      scan_rate: 10
      blind: 0.15
      point_filter_num: 2
      min_range: 0.15
      max_range: 40.0
      feature_extract_enable: false
      lidar_type2: 6
      point_filter_num2: 2
      blind2: 0.3
      min_range2: 0.3
      max_range2: 20.0
      min_confidence2: 40.0

    mapping:
      down_sample_size: 0.15
      max_iteration: 4
      voxel_size: 0.25
      max_layer: 4
      layer_point_size: [5.0, 5.0, 5.0, 5.0, 5.0]
      plannar_threshold: 0.05
      max_points_size: 1000
      max_cov_points_size: 1000
      fov_degree: 360.0
      det_range: 40.0
      extrinsic_est_en: false
      # Official chain (reference yaml): Mid@Go2IMU Ry(+13°), L2_wrt_L1 Ry(-13°).
      # Mid R=I + L2 Ry(-13°) left Odin pitched vs gravity-aligned Mid → Bundle
      # Z climbed ~tan(13°)*path while singles stayed flat. Joint map stays on.
      extrinsic_T: [0.187, 0.0, 0.0803]
      extrinsic_R: [0.9711343, 0.0000000, 0.2385335,
                    0.0000000, 1.0000000, 0.0000000,
                   -0.2385335, 0.0000000, 0.9711343]
      extrinsic_T_L2_wrt_L1: [0.1324518, -0.0103959, 0.078]
      extrinsic_R_L2_wrt_L1: [0.9711343, 0.0000000, -0.2385335,
                             0.0000000, 1.0000000, 0.0000000,
                             0.2385335, 0.0000000, 0.9711343]
      # No Odin pose hijack (replace/factor/xy). Bundle IEKF only.
      odin_z_replace_en: false
      odin_odom_topic: "/odin1/odometry"
      odin_bundle_z_band: 0.0
      bundle_end_dt_max: 0.10
      # Soften Mid floor planes; Odin floor residuals OFF in IEKF (tri-source:
      # Odin floors caused ~13° early +Z climb). Odin walls stay in joint IEKF.
      # Voxel map stays joint (Mid+Odin) — tight couple densify, not Mid-only.
      residual_z_en: true
      residual_z_floor_info_scale: 0.45
      residual_z_h_dampen: 0.50
      residual_z_multilevel_h_min: 1.0
      residual_z_multilevel_thr: 1.5
      odin_floor_info_scale: 0.0
      odin_wall_info_boost: 1.6
      odin_max_residual: 0.35
      bundle_map_mid_only: false
      bundle_l2_dz_reject: 0.16
      bundle_l2_d_reject: 0.35

    noise_model:
      ranging_cov: 0.04
      angle_cov: 0.1
      acc_cov: 0.2
      gyr_cov: 0.05
      b_acc_cov: 0.0043
      b_gyr_cov: 0.000266

    publish:
      pub_voxel_map: false
      publish_global_cloud_map: true
      publish_max_voxel_layer: 1
      path_en: true
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: false
      interval: -1
