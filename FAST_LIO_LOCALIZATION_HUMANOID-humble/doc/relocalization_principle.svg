<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3a4a"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #172033; }
      .label { font: 600 18px sans-serif; fill: #172033; }
      .text { font: 15px sans-serif; fill: #3b4658; }
      .small { font: 13px sans-serif; fill: #526071; }
      .box { fill: #ffffff; stroke: #6c7a89; stroke-width: 2; rx: 10; }
      .map { fill: #eef4ff; stroke: #4d83c4; }
      .scan { fill: #eef9f0; stroke: #56a36d; }
      .match { fill: #fff3df; stroke: #cc8b30; }
      .verify { fill: #fff0f0; stroke: #c95c5c; }
      .line { stroke: #2f3a4a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #6c7a89; stroke-width: 1.5; fill: none; }
      .pointA { fill: #4d83c4; }
      .pointB { fill: #56a36d; }
      .pointC { fill: #cc8b30; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#f7f9fc"/>
  <text x="40" y="50" class="title">图 2 FPFH/RANSAC 粗配准与 ICP 精配准原理</text>

  <rect x="52" y="95" width="260" height="340" class="box map"/>
  <text x="82" y="130" class="label">地图子图库</text>
  <text x="82" y="158" class="text">全局地图被划分为多个重叠子图</text>
  <rect x="86" y="190" width="64" height="64" fill="#dbeaff" stroke="#4d83c4"/>
  <rect x="158" y="190" width="64" height="64" fill="#dbeaff" stroke="#4d83c4"/>
  <rect x="86" y="262" width="64" height="64" fill="#dbeaff" stroke="#4d83c4"/>
  <rect x="158" y="262" width="64" height="64" fill="#cfe1f8" stroke="#4d83c4" stroke-width="3"/>
  <text x="238" y="302" class="small">候选子图</text>
  <text x="82" y="372" class="small">每个子图预计算法向量与 FPFH 特征</text>

  <rect x="380" y="95" width="230" height="340" class="box scan"/>
  <text x="410" y="130" class="label">当前雷达点云</text>
  <text x="410" y="158" class="text">多帧累积后计算 FPFH</text>
  <circle cx="438" cy="230" r="6" class="pointB"/>
  <circle cx="482" cy="205" r="6" class="pointB"/>
  <circle cx="525" cy="255" r="6" class="pointB"/>
  <circle cx="555" cy="310" r="6" class="pointB"/>
  <circle cx="470" cy="332" r="6" class="pointB"/>
  <path d="M430 310 L515 310 L515 220" class="thin"/>
  <text x="410" y="372" class="small">FPFH 描述局部几何形状，而非绝对坐标</text>

  <rect x="680" y="95" width="210" height="150" class="box match"/>
  <text x="710" y="130" class="label">FPFH 匹配</text>
  <text x="710" y="158" class="text">寻找相似局部几何</text>
  <text x="710" y="182" class="small">墙角、边缘、平面等特征</text>
  <circle cx="733" cy="215" r="5" class="pointB"/>
  <line x1="742" y1="215" x2="810" y2="215" class="thin"/>
  <circle cx="820" cy="215" r="5" class="pointA"/>

  <rect x="680" y="285" width="210" height="150" class="box match"/>
  <text x="710" y="320" class="label">RANSAC 粗配准</text>
  <text x="710" y="348" class="text">从真假匹配中估计粗位姿</text>
  <text x="710" y="372" class="small">输出若干候选变换</text>
  <text x="710" y="405" class="small">T_map_scan candidates</text>

  <rect x="960" y="95" width="170" height="150" class="box verify"/>
  <text x="990" y="130" class="label">ICP 精配准</text>
  <text x="990" y="158" class="text">在粗位姿基础上</text>
  <text x="990" y="182" class="text">微调旋转和平移</text>
  <text x="990" y="214" class="small">提高对齐精度</text>

  <rect x="960" y="285" width="170" height="150" class="box verify"/>
  <text x="990" y="320" class="label">质量验证</text>
  <text x="990" y="348" class="text">fitness / RMSE</text>
  <text x="990" y="372" class="text">候选差异 / 连续帧一致</text>
  <text x="990" y="405" class="small">通过后更新 map->odom</text>

  <line x1="312" y1="265" x2="380" y2="265" class="line"/>
  <line x1="610" y1="220" x2="680" y2="170" class="line"/>
  <line x1="610" y1="310" x2="680" y2="360" class="line"/>
  <line x1="890" y1="170" x2="960" y2="170" class="line"/>
  <line x1="1045" y1="245" x2="1045" y2="285" class="line"/>

  <text x="54" y="500" class="text">FPFH/RANSAC 解决“没有可靠初值时先找到大致位置”的问题；ICP 解决“已知大致位置后精细对齐”的问题。二者结合可以降低人工初始位姿依赖。</text>
</svg>
